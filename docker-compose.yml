services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexspend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexspend}
      POSTGRES_DB: ${POSTGRES_DB:-lexspend}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexspend}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lexspend}:${POSTGRES_PASSWORD:-lexspend}@db:5432/${POSTGRES_DB:-lexspend}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      CORS_ORIGINS: '["http://localhost:3000"]'
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
    - ./frontend/src:/app/src              # Mount source code only
    - ./frontend/public:/app/public        # Mount public assets
    - ./frontend/next.config.js:/app/next.config.js
    - ./frontend/tsconfig.json:/app/tsconfig.json
    ports:
      - "3000:3000"

volumes:
  postgres_data:
